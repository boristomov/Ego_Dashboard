name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      include_thumbs:
        description: "Download thumbnails into the bundle"
        type: boolean
        required: false
        default: true
      force_full_snapshot:
        description: "Ignore the thumb cache and re-download every thumbnail"
        type: boolean
        required: false
        default: false
  schedule:
    # Every 5 minutes — minimum cron granularity on GitHub Actions. Cheap on
    # public repos (unlimited minutes) thanks to the thumbnail cache. In
    # practice GitHub drops most of these under load; ~20 runs/day is typical.
    - cron: "*/5 * * * *"
    # Backstop at an off-peak, non-round minute, which GitHub is far likelier
    # to honour than the high-frequency entry above. Every deploy re-mints the
    # catalogue's presigned URLs, so a run at least every few hours is what
    # keeps downloads alive.
    - cron: "23 */4 * * *"
  #
  # WARNING: none of the above survives repository inactivity. GitHub disables
  # scheduled workflows after 60 days without a commit, with no failure and no
  # warning in the Actions UI. That is what broke every download on the site
  # for 16 days in Aug 2026: last commit 2026-06-12, cron stopped 2026-08-11
  # (day 60), the 7-day presigned URLs expired on 08-18, and a client hit an
  # S3 "Request has expired" page on 08-22. A push on 09-03 silently revived
  # the schedule, which is the only reason it recovered.
  #
  # The durable fix is the Cloudflare cron in infra/download-redirect, which
  # dispatches this workflow from outside GitHub. See that README.

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Cache thumbnails between runs so the 5-min cadence is cheap. The key
      # changes daily so we still refresh anything that drifted out of sync.
      - name: Restore thumb cache
        if: ${{ github.event.inputs.force_full_snapshot != 'true' }}
        uses: actions/cache@v4
        with:
          path: public/thumbs
          # v2: thumbnails are namespaced by collection now that the catalogue
          # spans two accounts, so the v1 layout is stale.
          key: ego-thumbs-v2-${{ github.run_id }}
          restore-keys: |
            ego-thumbs-v2-

      # The catalogue spans two AWS accounts. The pilot recordings stayed in
      # the original account rather than being copied, so each source is read
      # with its own credentials and neither account grants the other anything.
      #
      # PILOT_* falls back to the unprefixed pair, so this keeps working
      # unchanged until the new account exists. To add it: set AWS_PILOT_*
      # to today's key, then repoint AWS_ACCESS_KEY_ID at the new account and
      # set S3_RAW_BUCKET / S3_PROCESSED_BUCKET. The "prod" source stays
      # inactive while those two are empty.
      - name: Snapshot S3 → public/
        env:
          AWS_PILOT_ACCESS_KEY_ID: ${{ secrets.AWS_PILOT_ACCESS_KEY_ID }}
          AWS_PILOT_SECRET_ACCESS_KEY: ${{ secrets.AWS_PILOT_SECRET_ACCESS_KEY }}
          AWS_PILOT_REGION: ${{ vars.AWS_PILOT_REGION || 'ap-southeast-1' }}
          S3_PILOT_RAW_BUCKET: ${{ vars.S3_PILOT_RAW_BUCKET || 'ego-raw-prod-886989006633-ap-southeast-1-an' }}
          S3_PILOT_PROCESSED_BUCKET: ${{ vars.S3_PILOT_PROCESSED_BUCKET || 'ego-processed-prod-886989006633-ap-southeast-1-an' }}

          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-1' }}
          S3_RAW_BUCKET: ${{ vars.S3_RAW_BUCKET }}
          S3_PROCESSED_BUCKET: ${{ vars.S3_PROCESSED_BUCKET }}
        run: |
          if [ -z "${AWS_ACCESS_KEY_ID:-}" ] && [ -z "${AWS_PILOT_ACCESS_KEY_ID:-}" ]; then
            echo "::warning::No AWS credentials set for any source; skipping snapshot."
            mkdir -p public
            echo '{"sessions":[],"count":0}' > public/catalogue.json
            echo '{"generatedAt":"'"$(date -u +%FT%TZ)"'","sessionCount":0,"taskCount":0,"thumbs":{"included":false},"note":"AWS secrets not configured"}' > public/snapshot-meta.json
          else
            FLAGS=""
            if [ "${{ github.event.inputs.include_thumbs }}" = "false" ]; then
              FLAGS="$FLAGS --no-thumbs"
            fi
            if [ "${{ github.event.inputs.force_full_snapshot }}" != "true" ]; then
              FLAGS="$FLAGS --use-existing-thumbs"
            fi
            node scripts/snapshot.mjs $FLAGS
          fi

      # Poll the Vast.ai postprocessing fleet over SSH so the dashboard knows
      # what each box is doing. Only runs if VAST_SSH_PRIVATE_KEY is set.
      - name: Poll Vast.ai instances over SSH
        env:
          VAST_SSH_PRIVATE_KEY: ${{ secrets.VAST_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "${VAST_SSH_PRIVATE_KEY:-}" ]; then
            echo "::warning::VAST_SSH_PRIVATE_KEY secret is not set; writing empty instances.json."
            mkdir -p public
            echo '{"generatedAt":"'"$(date -u +%FT%TZ)"'","instances":[]}' > public/instances.json
          else
            mkdir -p ~/.ssh
            printf '%s\n' "$VAST_SSH_PRIVATE_KEY" > ~/.ssh/vast_instance_1
            chmod 600 ~/.ssh/vast_instance_1
            SSH_KEY=~/.ssh/vast_instance_1 node scripts/poll-instances.mjs
            shred -u ~/.ssh/vast_instance_1 || rm -f ~/.ssh/vast_instance_1
          fi

      # Collect the recording stations' heartbeats. Stations push these to
      # s3://<raw bucket>/_fleet/ themselves, so this only reads — no extra
      # credentials, and no station list to maintain.
      #
      # Pinned to its own variable rather than following the snapshot's raw
      # bucket: the rigs keep publishing wherever they are configured to
      # upload, so this must not move to the new account until they do.
      - name: Collect recording-station heartbeats
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_FLEET_ACCESS_KEY_ID || secrets.AWS_PILOT_ACCESS_KEY_ID || secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_FLEET_SECRET_ACCESS_KEY || secrets.AWS_PILOT_SECRET_ACCESS_KEY || secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-1' }}
          S3_FLEET_BUCKET: ${{ vars.S3_FLEET_BUCKET || 'ego-raw-prod-886989006633-ap-southeast-1-an' }}
        run: node scripts/poll-stations.mjs

      - name: Build site
        env:
          VITE_DATA_SOURCE: static
          # Served from the root of the custom domain (egodash.aithoth.com),
          # so the base is "/", not "/Ego_Dashboard/". The CNAME file in
          # public/ keeps the custom domain bound on every deploy.
          VITE_BASE: /
          VITE_BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          # Lead capture writes to client-data-access via a Cognito guest
          # identity pool (see infra/lead-capture). These are non-secret and
          # default to the live pool in src/lib/lead.ts; override here only if
          # the pool/region/bucket change.
          VITE_LEADS_POOL_ID: ${{ vars.VITE_LEADS_POOL_ID }}
          VITE_LEADS_REGION: ${{ vars.VITE_LEADS_REGION }}
          VITE_LEADS_BUCKET: ${{ vars.VITE_LEADS_BUCKET }}
          # CAPTCHA (Cloudflare Turnstile + Worker verifier, infra/captcha).
          # Both unset → the access gate runs without a captcha; set both repo
          # variables to activate it. Non-secret values.
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
          VITE_CAPTCHA_ENDPOINT: ${{ vars.VITE_CAPTCHA_ENDPOINT }}
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
